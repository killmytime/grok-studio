services:
  grok-studio:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env.local
        required: false
    # Host files are owned by the Mac user; root can write the bind-mounted SQLite/WAL.
    user: "0:0"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
